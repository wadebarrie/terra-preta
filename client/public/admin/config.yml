                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Safety & Insurance"
            name: "safetyInsurance"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "select", options: ["Shield"] }
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Points"
                    name: "points"
                    widget: "list"
                    field: { label: "Point", name: "point", widget: "string" }

      # CONTACT PAGE
      - label: "Contact Page"
