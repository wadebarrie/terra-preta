backend:
  name: git-gateway
  branch: main

media_folder: "client/public/uploads"
public_folder: "/uploads"

# Enable the ability to delete items
publish_mode: editorial_workflow

collections:
  # PAGES COLLECTION
  - name: "pages"
    label: "Pages"
    files:
      # HOME PAGE
      - label: "Home Page"
        name: "home"
        file: "content/pages/home.json"
        fields:
          - { label: "SEO — Page title", name: "metaTitle", widget: "string" }
          - { label: "SEO — Meta description", name: "metaDescription", widget: "text" }
          - label: "Home — Product cards (below fold)"
            name: "agProductsSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Products"
                name: "products"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Link (href)", name: "href", widget: "string" }
                  - { label: "OMRI listed", name: "omriListed", widget: "boolean", default: false }
          - label: "FAQ Section"
            name: "faqSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Questions"
                name: "questions"
                widget: "list"
                fields:
                  - { label: "Question", name: "question", widget: "string" }
                  - { label: "Answer", name: "answer", widget: "text" }
          - label: "Hero Section"
            name: "heroSection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Hero Title", name: "title", widget: "string" }
              - { label: "Hero Subtitle", name: "subtitle", widget: "text" }
          - label: "Hero Video"
            name: "heroVideo"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Wistia Video URL or ID", name: "wistiaUrl", widget: "string", required: false }
              - { label: "Autoplay", name: "autoplay", widget: "boolean", default: true }
              - { label: "Loop", name: "loop", widget: "boolean", default: true }
              - { label: "Show Controls", name: "controls", widget: "boolean", default: false }
              - { label: "Muted", name: "muted", widget: "boolean", default: true }
              - label: "Gradient Overlay"
                name: "gradient"
                widget: "object"
                required: false
                collapsed: true
                fields:
                  - { label: "Top Opacity (%)", name: "topOpacity", widget: "number", default: 60, min: 0, max: 100 }
                  - { label: "Bottom Opacity (%)", name: "bottomOpacity", widget: "number", default: 90, min: 0, max: 100 }
                  - { label: "Direction", name: "direction", widget: "select", default: "to-b", options: ["to-b", "to-t", "to-br", "to-bl", "to-tr", "to-tl"] }
          - label: "Features Section (Who It's For)"
            name: "featuresSection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string", default: "Who it's for" }
              - label: "Features"
                name: "features"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Icon", name: "icon", widget: "select", options: ["Sprout", "Leaf", "Layers"] }
                  - { label: "Link", name: "link", widget: "string" }
          - label: "How It Works Section"
            name: "howItWorksSection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string", default: "How it works" }
              - label: "Steps"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Number", name: "number", widget: "number", min: 1, max: 10 }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Outcomes Section"
            name: "outcomesSection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string", default: "Outcomes that matter" }
              - label: "Outcomes"
                name: "outcomes"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Product Snapshot Section"
            name: "productSnapshotSection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string", default: "Product snapshot: Terra Revive" }
              - { label: "Intro (optional)", name: "intro", widget: "text", required: false }
              - { label: "Product Image", name: "image", widget: "image" }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
              - label: "Product Details"
                name: "details"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "text" }
              - { label: "Button Text", name: "buttonText", widget: "string" }
              - { label: "Button Link", name: "buttonLink", widget: "string" }
          - label: "Evidence Section"
            name: "evidenceSection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string", default: "Evidence from the field" }
              - { label: "Show Case Studies Button", name: "showCaseStudiesButton", widget: "boolean", default: false }
              - label: "Case Studies"
                name: "caseStudies"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Location/Method", name: "location", widget: "string" }
                  - { label: "Result", name: "result", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }
              - { label: "Coming Soon Message", name: "comingSoonMessage", widget: "string", default: "Case Studies Coming Soon" }
          - label: "Bid Ready Download Section"
            name: "bidReadySection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Contact & Support Section"
            name: "contactSection"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Primary button label", name: "primaryButton", widget: "string", required: false }
              - { label: "Secondary button label", name: "secondaryButton", widget: "string", required: false }

      - label: "Home Page — Agriculture hero & sections"
        name: "home-ag-pivot"
        file: "content/pages/home-ag-pivot.json"
        fields:
          - label: "Agriculture homepage"
            name: "agPivot"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Enable agriculture layout on home", name: "enabled", widget: "boolean", default: true }
              - { label: "Brand line (over hero)", name: "brandLine", widget: "string" }
              - { label: "Hero title", name: "heroTitle", widget: "string" }
              - { label: "Hero subtitle", name: "heroSubtitle", widget: "text" }
              - label: "Hero primary CTA"
                name: "heroPrimaryCta"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }
              - label: "Hero secondary CTA"
                name: "heroSecondaryCta"
                widget: "object"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Href", name: "href", widget: "string" }
              - label: "Organic fertility compromise"
                name: "compromiseSection"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Paragraphs"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Paragraph", name: "paragraph", widget: "text" }
              - label: "There is"
                name: "thereIsSection"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Paragraph", name: "paragraph", widget: "text" }
              - label: "Products grid (SuperN / OrganiPhos cards)"
                name: "productsSection"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Anchor ID (e.g. products)", name: "anchorId", widget: "string", default: "products" }
                  - { label: "More coming note", name: "moreComing", widget: "text", required: false }
                  - label: "Products"
                    name: "products"
                    widget: "list"
                    fields:
                      - { label: "Name", name: "name", widget: "string" }
                      - { label: "Badge", name: "badge", widget: "string", required: false }
                      - { label: "Headline", name: "headline", widget: "string" }
                      - { label: "Subheadline", name: "subheadline", widget: "string" }
                      - { label: "Description", name: "description", widget: "text" }
                      - { label: "Price note", name: "priceNote", widget: "string", required: false }
                      - label: "Primary CTA"
                        name: "primaryCta"
                        widget: "object"
                        fields:
                          - { label: "Label", name: "label", widget: "string" }
                          - { label: "Href", name: "href", widget: "string" }
                      - label: "Secondary CTA"
                        name: "secondaryCta"
                        widget: "object"
                        fields:
                          - { label: "Label", name: "label", widget: "string" }
                          - { label: "Href", name: "href", widget: "string" }
                      - label: "Learn more CTA"
                        name: "learnMoreCta"
                        widget: "object"
                        fields:
                          - { label: "Label", name: "label", widget: "string" }
                          - { label: "Href", name: "href", widget: "string" }
              - label: "Good fit / not a fit"
                name: "fitSection"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Section title", name: "title", widget: "string" }
                  - { label: "Good fit heading", name: "goodFitTitle", widget: "string" }
                  - label: "Good fit bullets"
                    name: "goodFitBullets"
                    widget: "list"
                    field: { label: "Bullet", name: "bullet", widget: "text" }
                  - { label: "Not a fit heading", name: "notFitTitle", widget: "string" }
                  - label: "Not a fit bullets"
                    name: "notFitBullets"
                    widget: "list"
                    field: { label: "Bullet", name: "bullet", widget: "text" }
              - label: "Prairie soils"
                name: "prairieSection"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Paragraph", name: "paragraph", widget: "text" }
              - label: "Story"
                name: "storySection"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Sections"
                    name: "sections"
                    widget: "list"
                    fields:
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Paragraph", name: "paragraph", widget: "text" }
              - label: "Talk / CTAs"
                name: "talkSection"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Subtitle", name: "subtitle", widget: "text" }
                  - label: "CTA cards"
                    name: "ctas"
                    widget: "list"
                    fields:
                      - { label: "Title", name: "title", widget: "string" }
                      - { label: "Description", name: "description", widget: "text" }
                      - { label: "Href", name: "href", widget: "string" }
                  - { label: "Direct contact line", name: "directContactLine", widget: "string" }
                  - { label: "Direct contact email", name: "directContactEmail", widget: "string" }

      # ABOUT PAGE
      - label: "About Page"
        name: "about"
        file: "content/pages/about.json"
        fields:
          - { label: "SEO — Page title", name: "metaTitle", widget: "string" }
          - { label: "SEO — Meta description", name: "metaDescription", widget: "text" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - label: "Our Story"
            name: "story"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Facility & Quality Assurance"
            name: "facility"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "sectionTitle", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "select", options: ["Building", "Award", "Shield"] }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Team"
            name: "team"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Team Members"
                name: "members"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Photo", name: "photo", widget: "image", required: false }
          - label: "Safety & Insurance"
            name: "safetyInsurance"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "select", options: ["Shield"] }
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Points"
                    name: "points"
                    widget: "list"
                    field: { label: "Point", name: "point", widget: "string" }

      # CONTACT PAGE
      - label: "Contact Page"
        name: "contact"
        file: "content/pages/contact.json"
        fields:
          - { label: "SEO — Page title", name: "metaTitle", widget: "string" }
          - { label: "SEO — Meta description", name: "metaDescription", widget: "text" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - label: "Contact Cards"
            name: "contactCards"
            widget: "list"
            fields:
              - { label: "Icon", name: "icon", widget: "select", options: ["MapPin", "Mail", "Phone"] }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Lines"
                name: "lines"
                widget: "list"
                required: false
                field: { label: "Line", name: "line", widget: "string" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone tel: link (E.164, optional)", name: "tel", widget: "string", required: false }
          - label: "Lead form (agriculture quote)"
            name: "leadForm"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Card title", name: "cardTitle", widget: "string" }
              - { label: "Submit button label", name: "submitLabel", widget: "string" }
              - { label: "Submitting label", name: "submittingLabel", widget: "string" }
              - { label: "Footer note under form", name: "footerNote", widget: "text" }
              - { label: "Submit another button", name: "submitAnotherLabel", widget: "string" }
              - label: "Inquiry type options"
                name: "intentOptions"
                widget: "list"
                fields:
                  - { label: "Value (Order|Sample|General)", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
              - label: "Field labels"
                name: "labels"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Inquiry type", name: "intent", widget: "string" }
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Company", name: "company", widget: "string" }
                  - { label: "Email", name: "email", widget: "string" }
                  - { label: "Phone", name: "phone", widget: "string" }
                  - { label: "Province", name: "province", widget: "string" }
                  - { label: "Acres", name: "acres", widget: "string" }
                  - { label: "Product interest", name: "productInterest", widget: "string" }
                  - { label: "Notes", name: "notes", widget: "string" }
              - label: "Placeholders"
                name: "placeholders"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Province", name: "province", widget: "string", required: false }
                  - { label: "Acres", name: "acres", widget: "string", required: false }
                  - { label: "Notes", name: "notes", widget: "string", required: false }
              - label: "Product options"
                name: "productOptions"
                widget: "list"
                fields:
                  - { label: "Value", name: "value", widget: "string" }
                  - { label: "Label", name: "label", widget: "string" }
          - label: "Form Configuration"
            name: "form"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Step 1 Title", name: "step1Title", widget: "string" }
              - { label: "Step 2 Title", name: "step2Title", widget: "string" }
              - { label: "Step 3 Title", name: "step3Title", widget: "string" }
              - { label: "Success Message", name: "successMessage", widget: "text" }
              - { label: "Error Message", name: "errorMessage", widget: "text" }
              - { label: "Footer Note", name: "footerNote", widget: "text" }
          - { label: "Formspree Endpoint", name: "formspreeEndpoint", widget: "string" }

      - label: "Agriculture Page"
        name: "agriculture"
        file: "content/pages/agriculture.json"
        fields:
          - { label: "SEO — Page title", name: "metaTitle", widget: "string" }
          - { label: "SEO — Meta description", name: "metaDescription", widget: "text" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtitle", name: "heroSubtitle", widget: "text" }
          - label: "Product lineup"
            name: "productLineupSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - label: "Products"
                name: "products"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Href", name: "href", widget: "string" }
                  - { label: "OMRI listed", name: "omriListed", widget: "boolean", default: false }
          - label: "Problem Section"
            name: "problemSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Paragraphs"
                name: "paragraphs"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Solution Section"
            name: "solutionSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - label: "Benefits"
                name: "benefits"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Methods Section"
            name: "methodSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Methods"
                name: "methods"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Best For", name: "bestFor", widget: "text" }
          - label: "Expectations Section"
            name: "expectationsSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - label: "This Season"
                name: "thisSeason"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
              - label: "Next Season"
                name: "nextSeason"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - label: "Items"
                    name: "items"
                    widget: "list"
                    field: { label: "Item", name: "item", widget: "string" }
          - label: "Evidence Section"
            name: "evidenceSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Show Case Studies", name: "showCaseStudies", widget: "boolean", default: false }
              - { label: "Coming Soon Message", name: "comingSoonMessage", widget: "string" }
              - label: "Case Studies"
                name: "caseStudies"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Location", name: "location", widget: "string" }
                  - { label: "Result", name: "result", widget: "text" }
                  - { label: "Image", name: "image", widget: "image" }
          - label: "CTA Section"
            name: "ctaSection"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "text" }
              - { label: "Primary Button", name: "primaryButton", widget: "string" }
              - { label: "Secondary Button", name: "secondaryButton", widget: "string" }

      - label: "SuperN Product Page"
        name: "supern"
        file: "content/pages/supern.json"
        fields:
          - { label: "Slug", name: "slug", widget: "string" }
