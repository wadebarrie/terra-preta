            widget: "list"
            fields:
              - { label: "Icon", name: "icon", widget: "select", options: ["MapPin", "Mail", "Phone"] }
              - { label: "Title", name: "title", widget: "string" }
              - label: "Lines"
                name: "lines"
                widget: "list"
                required: false
                field: { label: "Line", name: "line", widget: "string" }
              - { label: "Email", name: "email", widget: "string", required: false }
          - label: "Form Configuration"
            name: "form"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Step 1 Title", name: "step1Title", widget: "string" }
              - { label: "Step 2 Title", name: "step2Title", widget: "string" }
              - { label: "Step 3 Title", name: "step3Title", widget: "string" }
              - { label: "Success Message", name: "successMessage", widget: "text" }
              - { label: "Error Message", name: "errorMessage", widget: "text" }
              - { label: "Footer Note", name: "footerNote", widget: "text" }
          - { label: "Formspree Endpoint", name: "formspreeEndpoint", widget: "string" }

      # RECLAMATION SITES
      - label: "Reclamation Sites"
        name: "reclamation-sites"
        file: "content/pages/reclamation-sites.json"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
