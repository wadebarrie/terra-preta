                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Facility & Quality Assurance"
            name: "facility"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "sectionTitle", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icon", name: "icon", widget: "select", options: ["Building", "Award", "Shield"] }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Team"
            name: "team"
            widget: "object"
            fields:
              - { label: "Show Section", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Title", name: "title", widget: "string" }
              - label: "Team Members"
                name: "members"
