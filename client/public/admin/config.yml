                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }

  # SETTINGS
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Header, footer & trust strip"
        name: "site-chrome"
        file: "content/settings/site-chrome.json"
        fields:
