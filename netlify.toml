[build]
  command = "pnpm run build"
  publish = "dist/public"
  functions = "netlify/functions"

# Environment variables for build
[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  NODE_ENV = "production"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API routes (Netlify Functions)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Legacy URL redirects (four-page restructure)
[[redirects]]
  from = "/supern"
  to = "/agriculture"
  status = 301
[[redirects]]
  from = "/organiphos"
  to = "/agriculture"
  status = 301
[[redirects]]
  from = "/solutions/agriculture"
  to = "/agriculture"
  status = 301
[[redirects]]
  from = "/solutions/reclamation"
  to = "/reclamation"
  status = 301
[[redirects]]
  from = "/solutions/hydroseeding"
  to = "/reclamation"
  status = 301
[[redirects]]
  from = "/solutions/mining"
  to = "/reclamation"
  status = 301
[[redirects]]
  from = "/product/terra-revive"
  to = "/reclamation"
  status = 301
[[redirects]]
  from = "/calculator/*"
  to = "/reclamation"
  status = 301
[[redirects]]
  from = "/evidence/*"
  to = "/reclamation"
  status = 301
[[redirects]]
  from = "/evidence"
  to = "/reclamation"
  status = 301

# SPA fallback — Netlify serves real files (e.g. /spec-sheets/*.pdf, /assets/*) first; this only runs when no file exists.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Dev settings for local development
[dev]
  command = "pnpm dev"
  port = 5173
  targetPort = 5173
  autoLaunch = false

